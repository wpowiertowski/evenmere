# M2-17b: nightly Era I balance-bot check on the starter island and 5 generated seeds.
# A seed that misses Era II does not fail the job (the miss is reported, exit 0);
# an invalid script or a crash exits non-zero and fails it. M2-16 adds perf.
name: nightly

on:
  schedule:
    # 07:00 UTC daily: midnight in Portland, off-peak everywhere.
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  balance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Build
        run: dotnet build Evenmere.sln -c Release --nologo

      - name: Run Era I balance bot (starter plus generated seeds 1-5)
        run: |
          mkdir -p balance-reports
          dotnet run --project src/Evenmere.Tools -c Release --no-build -- balance --map starter --bot tools/bots/era1.json --seed 7 --max-minutes 150 > "balance-reports/era1-starter.json" 2> "balance-reports/era1-starter.txt"
          dotnet run --project src/Evenmere.Tools -c Release --no-build -- balance --bot tools/bots/era1.json --seeds 1..5 --size 320 --max-minutes 150 > "balance-reports/era1-multiseed.json" 2> "balance-reports/era1-multiseed.txt"
          cat "balance-reports/era1-multiseed.txt"

      - name: Upload balance reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: balance-reports
          path: balance-reports

  # M2-16: nightly perf runs of both reference saves. The nightly records the raw numbers for the
  # trend (CI runners differ from the dev Mac); the M2 gate binds on the dev-Mac measurement.
  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Build
        run: dotnet build Evenmere.sln -c Release --nologo

      - name: Run perf (perf-2k and perf-20k)
        run: |
          mkdir -p perf-reports
          dotnet run --project src/Evenmere.Tools -c Release --no-build -- perf --save tests/fixtures/saves/perf-2k.evsave --ticks 2000 > "perf-reports/perf-2k.json" 2> "perf-reports/perf-2k.txt"
          dotnet run --project src/Evenmere.Tools -c Release --no-build -- perf --save tests/fixtures/saves/perf-20k.evsave --ticks 2000 > "perf-reports/perf-20k.json" 2> "perf-reports/perf-20k.txt"

      - name: Upload perf reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-reports
          path: perf-reports

  # M2-02c: nightly full start-guarantee sweep (seeds 1-100 at 256, 320 and 384). The normal suite runs
  # seeds 1-20; this sets EVENMERE_FULL_SWEEP=1 for the exhaustive contract. Slow (about 11 minutes),
  # so nightly only.
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Build
        run: dotnet build Evenmere.sln -c Release --nologo

      - name: Run full start-guarantee sweep
        env:
          EVENMERE_FULL_SWEEP: 1
        run: dotnet test -c Release --no-build --ignore-exit-code 8 --filter "FullyQualifiedName~StartGuaranteeTests.Generate_Seeds1To100AtAllSizes"
